<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IDFC Attendance System</title>
<style>
body{font-family:Arial;background:#eef2f6;padding:20px}
h1,h2,h3{text-align:center;color:#1f4aa8}
.box{max-width:480px;margin:auto;background:#fff;padding:20px;border-radius:8px;margin-bottom:20px}
input,button,select{padding:8px;margin:6px;width:100%}
button{background:#1f4aa8;color:#fff;border:none;border-radius:4px;cursor:pointer}
.logout{background:#c62828}
.present{background:#2e7d32}
.weekoff{background:#f57c00}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#1f4aa8;color:#fff}
.delete{background:#d32f2f;font-size:12px}
.hidden{display:none}
</style>
</head>

<body>

<h1>IDFC Attendance</h1>

<!-- LOGIN -->
<div id="loginBox" class="box">
<h2>Login</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- MAIN PANEL -->
<div id="mainPanel" class="box hidden">
<button class="logout" onclick="logout()">Logout</button>
<h2 id="welcome"></h2>

<button class="present" onclick="markPresent()">✔ Mark Present</button>

<h3>Apply Week Off</h3>
<input type="date" id="weekOffDate">
<button class="weekoff" onclick="applyWeekOff()">Apply Week Off</button>

<h3>Today Status</h3>
<table>
<thead>
<tr><th>Date</th><th>Status</th><th>Time</th></tr>
</thead>
<tbody id="todayTable"></tbody>
</table>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="box hidden">
<h2>Admin Panel</h2>

<select id="empSelect"></select>
<button onclick="loadAttendance()">View Attendance</button>

<table>
<thead>
<tr><th>Date</th><th>Status</th><th>Time</th><th>Action</th></tr>
</thead>
<tbody id="adminTable"></tbody>
</table>

<h3>📅 Week Off Updates</h3>
<table>
<thead>
<tr><th>Employee</th><th>Week Off Date</th><th>Applied On</th></tr>
</thead>
<tbody id="weekOffTable"></tbody>
</table>
</div>

<script>
const employees=["amit","divanshu","sujit","ganesh","nanki","shiv kumar","sheetal","manisha","aman","abhishek","khusboo","akshay","vikki","sumit"];
const adminPasswords={amit:"Amit2580",divanshu:"Divanshu2580"};
const EMP_PASSWORD="IDFC1234";
let currentUser="";
let isAdmin=false;

// LOGIN
function login(){
let u=username.value.toLowerCase().trim();
let p=password.value;

if(!employees.includes(u)) return alert("Invalid User");

if(adminPasswords[u]){
if(p!==adminPasswords[u]) return alert("Wrong Password");
isAdmin=true;
}else{
if(p!==EMP_PASSWORD) return alert("Wrong Password");
}

currentUser=u;
loginBox.classList.add("hidden");
mainPanel.classList.remove("hidden");
welcome.innerText="Welcome "+currentUser.toUpperCase();
loadToday();

if(isAdmin){
adminPanel.classList.remove("hidden");
loadAdminDropdown();
loadWeekOffs();
}
}

// LOGOUT
function logout(){location.reload();}

// MARK PRESENT (ONCE PER DAY)
function markPresent(){
let today=new Date().toLocaleDateString();
let time=new Date().toLocaleTimeString();
let data=JSON.parse(localStorage.getItem(currentUser))||{};
if(data[today]) return alert("Today attendance already marked");
data[today]={status:"Present",time:time};
localStorage.setItem(currentUser,JSON.stringify(data));
loadToday();
}

// SHOW TODAY ONLY
function loadToday(){
todayTable.innerHTML="";
let today=new Date().toLocaleDateString();
let data=JSON.parse(localStorage.getItem(currentUser))||{};
if(data[today]){
todayTable.innerHTML+=`<tr><td>${today}</td><td>${data[today].status}</td><td>${data[today].time}</td></tr>`;
}
}

// APPLY WEEK OFF (ONLY ONE PERSON PER DATE)
function applyWeekOff(){
let d=weekOffDate.value;
if(!d) return alert("Select date");

let offs=JSON.parse(localStorage.getItem("weekOffs"))||[];

// CHECK CONFLICT
let conflict=offs.find(o=>o.date===d);
if(conflict){
return alert(`${conflict.date} ko ${conflict.user.toUpperCase()} ne already Week Off dala hai`);
}

// SAVE
offs.push({
user:currentUser,
date:d,
applied:new Date().toLocaleString()
});
localStorage.setItem("weekOffs",JSON.stringify(offs));

alert("Week Off Applied Successfully");
weekOffDate.value="";
loadWeekOffs();
}

// ADMIN FUNCTIONS
function loadAdminDropdown(){
empSelect.innerHTML="";
employees.forEach(e=>{
empSelect.innerHTML+=`<option value="${e}">${e.toUpperCase()}</option>`;
});
}

function loadAttendance(){
let u=empSelect.value;
adminTable.innerHTML="";
let data=JSON.parse(localStorage.getItem(u))||{};
for(let d in data){
adminTable.innerHTML+=`
<tr>
<td>${d}</td>
<td>${data[d].status}</td>
<td>${data[d].time}</td>
<td><button class="delete" onclick="deleteRec('${u}','${d}')">Delete</button></td>
</tr>`;
}
}

function deleteRec(u,d){
if(!confirm("Delete attendance?"))return;
let data=JSON.parse(localStorage.getItem(u))||{};
delete data[d];
localStorage.setItem(u,JSON.stringify(data));
loadAttendance();
}

// WEEK OFF LIST (ADMIN)
function loadWeekOffs(){
weekOffTable.innerHTML="";
let offs=JSON.parse(localStorage.getItem("weekOffs"))||[];
offs.forEach(o=>{
weekOffTable.innerHTML+=`
<tr>
<td>${o.user.toUpperCase()}</td>
<td>${o.date}</td>
<td>${o.applied}</td>
</tr>`;
});
}
</script>

</body>
</html>
