<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>IDFC Attendance System</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<h1>IDFC Attendance</h1>

	<!-- LOGIN -->
	<div id="loginBox" class="box">
		<h2>Login</h2>
		<input id="username" placeholder="Username">
		<input id="password" type="password" placeholder="Password">
		<button onclick="login()">Login</button>
	</div>

	<!-- MAIN PANEL -->
	<div id="mainPanel" class="box hidden">
		<button class="logout" onclick="logout()">Logout</button>
		<h2 id="welcome"></h2>

		<button class="present" onclick="markPresent()">✔ Mark Present</button>

		<h3>Apply Week Off</h3>
		<input type="date" id="weekOffDate">
		<button class="weekoff" onclick="applyWeekOff()">Apply Week Off</button>

		<h3>Today Status</h3>
		<table>
			<thead>
				<tr>
					<th>Date</th>
					<th>Status</th>
					<th>Time</th>
				</tr>
			</thead>
			<tbody id="todayTable"></tbody>
		</table>
	</div>

	<!-- ADMIN PANEL -->
	<div id="adminPanel" class="box hidden">
		<h2>Admin Panel</h2>

		<select id="empSelect" onchange="loadAttendance()"></select>
		<button onclick="loadAttendance()">View Attendance</button>

		<table>
			<thead>
				<tr>
					<th>Date</th>
					<th>Status</th>
					<th>Time</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody id="adminTable"></tbody>
		</table>

		<h3>📅 Week Off Updates</h3>
		<table>
			<thead>
				<tr>
					<th>Employee</th>
					<th>Week Off Date</th>
					<th>Applied On</th>
				</tr>
			</thead>
			<tbody id="weekOffTable"></tbody>
		</table>
	</div>
	<script type="module">
		// Import Firebase SDKs
		import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
		import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
		import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

		// Your web app's Firebase configuration
		const firebaseConfig = {
			apiKey: "AIzaSyDpjMt2UMPI5JUpLsu57ZoH83iueXH1usg",
			authDomain: "attendence-system-5c057.firebaseapp.com",
			projectId: "attendence-system-5c057",
			storageBucket: "attendence-system-5c057.firebasestorage.app",
			messagingSenderId: "816903751374",
			appId: "1:816903751374:web:6a809ee1a13985a012729f",
			measurementId: "G-TKTVKZ53G3"
		};

		// Initialize Firebase
		const app = initializeApp(firebaseConfig);
		const analytics = getAnalytics(app);
		
		// Initialize Firestore
		window.db = getFirestore(app);
	</script>
	<script src="app.js"></script>

</body>

</html>
