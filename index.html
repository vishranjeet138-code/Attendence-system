<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>IDFC Attendance System</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<h1>IDFC Attendance</h1>
	<button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>

	<!-- LOGIN -->
	<div id="loginBox" class="box">
		<h2>Login</h2>
		<input id="username" placeholder="Username">
		<input id="password" type="password" placeholder="Password">
		<button onclick="login()">Login</button>
		<button onclick="openCreateAccountModal()" style="background: #1565c0;">Create New Account</button>
	</div>

	<!-- MAIN PANEL -->
	<div id="mainPanel" class="box hidden">
		<button class="logout" onclick="logout()">Logout</button>
		<h2 id="welcome"></h2>

		<button class="present" onclick="markPresent()">✔ Mark Present</button>

		<h3>Apply Week Off</h3>
		<input type="date" id="weekOffDate">
		<button class="weekoff" onclick="applyWeekOff()">Apply Week Off</button>

		<h3>Attendance Report</h3>
		<div class="pdf-options">
			<button onclick="downloadAttendancePDF('week')" style="background: #1565c0;">Download Week PDF</button>
			<button onclick="downloadAttendancePDF('month')" style="background: #1565c0;">Download Month PDF</button>
		</div>

		<h3>Today Status</h3>
		<table>
			<thead>
				<tr>
					<th>Date</th>
					<th>Status</th>
					<th>Time</th>
				</tr>
			</thead>
			<tbody id="todayTable"></tbody>
		</table>
	</div>

	<!-- ADMIN PANEL -->
	<div id="adminPanel" class="box hidden">
		<h2>Admin Panel</h2>

		<select id="empSelect" onchange="loadAttendance()"></select>
		<button onclick="loadAttendance()">View Attendance</button>

		<table>
			<thead>
				<tr>
					<th>Date</th>
					<th>Status</th>
					<th>Time</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody id="adminTable"></tbody>
		</table>

		<h3>📅 Week Off Updates</h3>
		<button id="toggleRecycleBtn" onclick="toggleRecycleBin()">Show Recycle Bin</button>
		<table>
			<thead>
				<tr>
					<th>Employee</th>
					<th>Week Off Date</th>
					<th>Applied On</th>
					<th>Action</th>
				</tr>
			</thead>
			<tbody id="weekOffTable"></tbody>
		</table>

		<div id="recycleSection" class="hidden">
			<h3>🗑️ Recycle Bin</h3>
			<table>
				<thead>
					<tr>
						<th>Type</th>
						<th>Employee</th>
						<th>Date</th>
						<th>Details</th>
						<th>Deleted On</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody id="recycleTable"></tbody>
			</table>
		</div>
	</div>

	<!-- CREATE ACCOUNT MODAL -->
	<div id="createAccountModal" class="modal">
		<div class="modal-content">
			<span class="close-modal" onclick="closeCreateAccountModal()">&times;</span>
			<h2>Create New Account</h2>
			<div class="form-group">
				<label>Username:</label>
				<input id="newUsername" type="text" placeholder="Enter username">
			</div>
			<div class="form-group" id="accountTypeGroup" style="display: none;">
				<label>Account Type:</label>
				<select id="newAccountType">
					<option value="employee">Employee</option>
					<option value="admin">Admin</option>
				</select>
			</div>
			<div class="form-group">
				<label>Password:</label>
				<input id="newPassword" type="password" placeholder="Enter password">
			</div>
			<div class="form-group">
				<label>Confirm Password:</label>
				<input id="confirmPassword" type="password" placeholder="Confirm password">
			</div>
			<button onclick="createNewAccount()" style="width: 100%;">Create Account</button>
		</div>
	</div>
	<script type="module">
		// Import Firebase SDKs
		import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
		import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-analytics.js";
		import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

		// Your web app's Firebase configuration
		const firebaseConfig = {
			apiKey: "AIzaSyDpjMt2UMPI5JUpLsu57ZoH83iueXH1usg",
			authDomain: "attendence-system-5c057.firebaseapp.com",
			projectId: "attendence-system-5c057",
			storageBucket: "attendence-system-5c057.firebasestorage.app",
			messagingSenderId: "816903751374",
			appId: "1:816903751374:web:6a809ee1a13985a012729f",
			measurementId: "G-TKTVKZ53G3"
		};

		// Initialize Firebase
		const app = initializeApp(firebaseConfig);
		const analytics = getAnalytics(app);
		
		// Initialize Firestore
		window.db = getFirestore(app);
	</script>
	<script src="app.js"></script>

</body>

</html>
